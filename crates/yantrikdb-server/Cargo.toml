[package]
name = "yantrikdb-server"
version = "0.16.2"
edition = "2021"
description = "YantrikDB database server — multi-tenant cognitive memory with wire protocol, HTTP gateway, replication, auto-failover, and at-rest encryption"
license = "Apache-2.0"
repository = "https://github.com/yantrikos/yantrikdb-server"
homepage = "https://github.com/yantrikos/yantrikdb-server"
documentation = "https://docs.rs/yantrikdb-server"
readme = "README.md"
keywords = ["database", "memory", "ai", "replication", "raft"]
categories = ["database", "database-implementations"]
authors = ["Pranab Sarkar <developer@pranab.co.in>"]

[[bin]]
name = "yantrikdb"
path = "src/main.rs"

[dependencies]
# Engine v0.14.0 — latest tagged release. Pinned by tag for a reproducible,
# released dependency. 0.13.1→0.14.0 is a MINOR bump (0.13.2/.3/.4 + 0.14.0) but
# verified ADDITIVE from the server's contract POV — server builds clean, full
# suite green. Notably it carries SECURITY fixes the server's encrypted-at-rest
# deployments want:
#   0.13.2 — the oplog was writing PLAINTEXT on encrypted databases (fixed).
#   0.13.3 — the security advisory's own check now reaches the Python layer.
#   0.13.4 — sealing a row is not erasing it (seal semantics hardened).
#   0.14.0 — new engine APIs (historical import, caller-supplied consolidation,
#     a rid point-read, pack namespace) — additive, unsurfaced by the server for
#     now; + an embedder process-global init + download-retry fix.
# Earlier: 0.13.0 BM25 lexical fusion + matched-window spans + token diet;
# 0.12.x `recall_as_of` (bitemporal, surfaced via /v1/temporal/as_of in RFC 032)
# + chunked embeddings + recency-wall-down; the EXPLAIN surface (0.13.1) is still
# unsurfaced. Engine owns no timer thread — host drives run_maintenance_cycle().
yantrikdb = { version = "0.17.1", git = "https://github.com/yantrikos/yantrikdb.git", tag = "v0.17.1" }
yantrikdb-protocol = { version = "0.1.0", path = "../yantrikdb-protocol" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"

# Lock primitives
# parking_lot provides non-poisoning Mutex/RwLock with runtime deadlock
# detection via the `deadlock_detection` feature. A background task in
# main.rs runs `deadlock::check_deadlock()` on a 10s cadence and logs any
# cycles with full backtraces. See CONCURRENCY.md for lock ordering rules.
parking_lot = { version = "0.12", features = ["deadlock_detection"] }

# HTTP gateway
axum = { version = "0.8", features = ["json"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Data
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Auth
sha2 = "0.10"
hex = "0.4"
rand = { version = "0.8", features = ["small_rng"] }
# RFC 030 admin RBAC: argon2id for admin-account password hashing (low-entropy
# human input needs a slow salted KDF — distinct from the SHA-256 used for
# high-entropy random tokens); HMAC-SHA256 for stateless signed session tokens.
argon2 = "0.5"
hmac = "0.12"
base64 = "0.22"

# Time formatting (Unix epoch ↔ ISO 8601 for HTTP responses). Issue
# #39 read endpoints emit RFC-3339 timestamps alongside the existing
# Unix-float fields. Already transitive via reqwest/openraft; making
# it a direct dep so the dep graph stays explicit.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics — lightweight Prometheus-compatible histograms and counters.
# metrics is the facade; metrics-process gives us process-level gauges
# (RSS, FDs, CPU). We render to Prometheus text format in /metrics by hand
# rather than using a full exporter, keeping the dep tree small.
metrics = "0.24"

# Config
toml = "0.8"

# TLS — `aws-lc-rs` feature is REQUIRED. Without it, rustls 0.23 has no
# default CryptoProvider and any TLS operation (openraft cluster transport,
# reqwest HTTPS client, etc.) panics at runtime. Issue #26.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Embeddings
fastembed = { version = "5", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }

# Optional: tokio-console for live runtime inspection.
# Build with: cargo build --features tokio-console
# Then attach: tokio-console http://127.0.0.1:6669
console-subscriber = { version = "0.4", optional = true }

# Misc
anyhow = "1"
blake3 = "1"
thiserror = "2"
uuid7 = { version = "1", features = ["serde"] }
bytes = "1"

# RFC 010: dyn-dispatched async trait for MutationCommitter so we can
# swap LocalSqliteCommitter ↔ RaftCommitter at runtime without rewiring
# every handler. Native async-in-trait (Rust 1.75+) doesn't support
# dyn dispatch, hence the crate.
async-trait = "0.1"

# openraft removed in Phase D (saga 239) — YRP (RFC 028, src/yrp/) is the
# native replication engine.

# For `cluster status` CLI command + cluster Raft transport with mTLS.
# `rustls-tls` enables Identity/Certificate APIs and uses rustls (same TLS
# stack as our cluster acceptor in security::cluster_tls).
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# RFC 009 — control-runtime SCHED_FIFO priority on Linux. No-op on other
# platforms (the runtime split + admission caps still apply).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tokio-test = "0.4"

[features]
default = []
# Enable tokio-console subscriber for live task/resource inspection.
# Build with: cargo build --features tokio-console
# Then attach: tokio-console http://127.0.0.1:6669
# Adds ~5% overhead — use for debugging, not production.
tokio-console = ["dep:console-subscriber"]
